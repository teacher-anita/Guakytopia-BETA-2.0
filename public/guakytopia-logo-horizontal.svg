<svg viewBox="0 0 460 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Left: Mascot Face Badge -->
  <g transform="translate(10, 5) scale(0.45)">
    <circle cx="100" cy="100" r="95" fill="#FFFFFF" stroke="#2EC4B6" stroke-width="4"/>
    <!-- Crest Feathers Top -->
    <path d="M 74 30 C 66 18 106 18 126 34 C 112 40 92 40 74 30 Z" fill="#FFD166" stroke="#243447" stroke-width="5"/>
    <path d="M 60 40 C 50 30 76 34 94 44 C 82 48 70 48 60 40 Z" fill="#2EC4B6" stroke="#243447" stroke-width="4"/>
    <!-- Head Base Oval Teal -->
    <ellipse cx="104" cy="98" rx="58" ry="65" fill="#2EC4B6" stroke="#243447" stroke-width="6"/>
    <!-- Globe lines -->
    <path d="M 88 44 Q 108 40 128 48" stroke="#1D9E92" stroke-width="2.5" fill="none"/>
    <path d="M 82 56 Q 108 50 134 60" stroke="#1D9E92" stroke-width="2.5" fill="none"/>
    <!-- White Eye Mask -->
    <path d="M 64 78 C 58 92 60 114 74 126 C 88 122 96 108 96 90 C 96 76 80 72 64 78 Z" fill="#FFFDF8" stroke="#243447" stroke-width="4.5"/>
    <!-- Eye -->
    <ellipse cx="80" cy="94" rx="10" ry="14" fill="#243447"/>
    <circle cx="83" cy="89" r="4" fill="#FFFFFF"/>
    <!-- Big Beak -->
    <path d="M 94 68 C 128 70 148 94 142 126 C 134 138 120 134 116 118 C 114 102 106 94 92 90 Z" fill="#FF6B4A" stroke="#243447" stroke-width="6"/>
    <path d="M 104 114 C 116 118 124 126 122 134 C 112 134 104 126 100 120 Z" fill="#243447"/>
  </g>

  <!-- Right: Official Typography "GÜAKYTOPIA" -->
  <text x="110" y="62" font-family="'Fredoka', 'Quicksand', 'Nunito', 'Segoe UI', sans-serif" font-weight="700" font-size="44" fill="#243447" letter-spacing="-1">
    G<tspan fill="#243447">Ü</tspan>AKYTOPIA
  </text>
  
  <!-- Subtitle Tagline "OPEN THE WORLD" -->
  <text x="112" y="84" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#2EC4B6" letter-spacing="3.5">
    OPEN THE WORLD
  </text>
</svg>
